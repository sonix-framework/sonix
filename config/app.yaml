app:
  name: Sonix Demo
logging:
  level: debug
  format: text
heartbeat:
  interval: 1s
http:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s
  shutdown_timeout: 10s

database:
  default: sqlite
  connections:
    sqlite:
      driver: sqlite
      dsn: file:notes.db
      max_open_conns: 5

queue:
  driver: memory
  workers: 2
  buffer: 100
  max_attempts: 3
  retry_backoff: 1s
  shutdown_timeout: 10s
